<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FTUI Student Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav>

        <div class="nav-container">

            <h2 class="logo">
                FTUI Hub
            </h2>

            <ul class="nav-menu">

                <li>
                    <a href="#beasiswa">
                        Beasiswa
                    </a>
                </li>

                <li>
                    <a href="#event">
                        Event
                    </a>
                </li>

                <li>
                    <a href="#sosial">
                        Sosial Media
                    </a>
                </li>

                <li>
                    <a href="admin.html">
                        Admin
                    </a>
                </li>

            </ul>

        </div>

    </nav>

    <!-- HERO -->
    <div class="hero">

        <h1>
            FTUI Student Hub
        </h1>

        <p>
            Pusat informasi beasiswa,
            event, dan sosial media FTUI
        </p>

    </div>

    <div class="search-section">
        <div class="search-controls">
            <input type="search"
                id="searchInput"
                placeholder="Cari...">

            <select id="sortSelect">
                <option value="none">Urutkan berdasarkan tanggal</option>
                <option value="asc">Tanggal terdekat</option>
                <option value="desc">Tanggal terjauh</option>
            </select>
        </div>
    </div>

    <!-- BEASISWA -->
    <section id="beasiswa">

        <h2>Beasiswa Terbaru</h2>

        <div class="container"
            id="beasiswaContainer">
        </div>

    </section>

    <!-- EVENT -->
    <section id="event">

        <h2>Event Terbaru</h2>

        <div class="container"
            id="eventContainer">
        </div>

    </section>

    <!-- SOSIAL -->
    <section id="sosial">

        <h2>Media Sosial</h2>

        <div class="container">

            <div style="cursor: pointer;" class="card social-card" 
                onclick="openLink('https://youtube.com/@fakultasteknikui_official')">

                <h3>FTUI YouTube</h3>

            </div>

            <div style="cursor: pointer;" class="card social-card" 
                onclick="openLink('https://www.instagram.com/fakultasteknik.ui')">

                <h3>FTUI Instagram</h3>

            </div>

            <div style="cursor: pointer;" class="card social-card" 
                onclick="openLink('https://www.instagram.com/dteftui')">

                <h3>Teknik Elektro</h3>

            </div>

            <div style="cursor: pointer;" class="card social-card"
                onclick="openLink('https://www.instagram.com/teknikindustri.ui')">

                <h3>Teknik Industri</h3>

            </div>

            <div style="cursor: pointer;" class="card social-card"
                onclick="openLink('https://www.instagram.com/dtkftui')">

                <h3>Teknik Kimia</h3>

            </div>

        </div>

    </section>

    <!-- MODAL -->
    <div class="modal"
        id="modal">

        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <br>
            <p id="modal-body"></p>
            <br>
            <button class="btn"
                onclick="closeModal()">
                Close
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>

</html>
