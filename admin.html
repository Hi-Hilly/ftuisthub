<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- LOGIN -->
    <div class="login-page"
        id="loginPage">

        <div class="login-box">

            <h1>Admin Login</h1>

            <input type="password"
                id="password"
                placeholder="Password">

            <button class="btn"
                onclick="login()">
                Login
            </button>

        </div>

    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel"
        style="display:none;">

        <section>

            <h1>Dashboard Admin</h1>

            <!-- BEASISWA -->
            <h2>Tambah Beasiswa</h2>

            <div class="form-container">

                <input type="text"
                    id="bNama"
                    placeholder="Nama">

                <input type="text"
                    id="bDeadline"
                    placeholder="Deadline">

                <input type="text"
                    id="bDesc"
                    placeholder="Deskripsi">

                <button class="btn"
                    onclick="addBeasiswa()">
                    Add
                </button>

            </div>

            <div class="container"
                id="adminBeasiswa">
            </div>

            <!-- EVENT -->
            <h2>Tambah Event</h2>

            <div class="form-container">

                <input type="text"
                    id="eNama"
                    placeholder="Nama Event">

                <input type="text"
                    id="eTanggal"
                    placeholder="Tanggal">

                <input type="text"
                    id="eDesc"
                    placeholder="Deskripsi">

                <button class="btn"
                    onclick="addEvent()">
                    Add
                </button>

            </div>

            <div class="container"
                id="adminEvent">
            </div>

        </section>

    </div>

    <script src="admin.js"></script>

</body>

</html>
